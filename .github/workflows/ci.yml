name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest hypothesis pyserial
      - run: cd python && pytest -q

  cpp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Build with AddressSanitizer + UBSan, warnings as errors
        run: |
          cmake -S cpp -B cpp/build-asan -DEDGEKIT_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          cmake --build cpp/build-asan -j
      - name: Unit tests + fuzz smoke (100k inputs)
        run: ctest --test-dir cpp/build-asan --output-on-failure

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - run: cmake -S cpp -B cpp/build -DEDGEKIT_TESTS=OFF
      - run: clang-tidy -p cpp/build cpp/src/*.cpp cpp/tools/*.cpp

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S cpp -B cpp/build-fuzz -DEDGEKIT_FUZZ=ON -DEDGEKIT_TESTS=OFF -DCMAKE_CXX_COMPILER=clang++
          cmake --build cpp/build-fuzz --target fuzz_parsers -j
      - name: Coverage-guided fuzzing, 2 minutes
        run: mkdir -p corpus && ./cpp/build-fuzz/fuzz_parsers corpus -max_total_time=120 -print_final_stats=1

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest hypothesis pyserial
      - run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DEDGEKIT_TESTS=OFF
          cmake --build cpp/build -j
      - name: C++ vs Python differential tests + C++ CLI against the Python serial simulator
        run: EDGEKIT_BUILD=cpp/build pytest -q tests_cross
